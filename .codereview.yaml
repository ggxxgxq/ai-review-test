version: "1.0"

review:
  enabled: true
  language: "zh"
  mode: "strict"
  max_review_length: 4000
  max_files: 50
  max_content_length: 20000

files:
  extensions:
    - ".js"
    - ".ts"
    - ".vue"
    - ".py"
    - ".java"
    - ".yml"
    - ".json"
    - ".md"
    - ".sql"
  include:
    - "**/*"
  exclude:
    - "dist/**/*"
    - "node_modules/**/*"
    - "test/**/*"
    - "**/*.min.js"
    - "**/*.min.css"

trigger:
  events:
    - "pull_request"
    - "push"
  branches:
    - "master"
    - "develop"
    - "main"
  include_draft: false
  ignore_rules:
    title_contains:
      - "WIP"
      - "Draft"
      - "DO NOT REVIEW"
    branch_matches:
      - "release/*"

# 参考信息配置 - 支持内部文件和外部URL
